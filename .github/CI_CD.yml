# GitHub Actions Workflow for CI/CD Pipeline
# This workflow automates the build, test, and release process for the order-service application.
# It runs on pushes to the 'dev' branch and consists of three jobs: Build, Test, and Release.

name: Build & Test

# Triggers: Run this workflow on push to the 'dev' branch
on:
  push:
    branches:
      - dev

jobs:
  # Job 1: Build Job
  # Purpose: Build a packaged version of the application, run unit tests, and create a Docker image.
  # This ensures the code compiles and basic functionality works before integration testing.
  Build:
    runs-on: ubuntu-latest

    steps:
      # Step 1.1: Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 1.2: Install project dependencies (simulated here)
      - name: Install Dependencies
        run: echo "Simulating Install Dependencies... Install Dependencies completed successfully!"

      # Step 1.3: Run unit tests to validate individual components
      # Unit tests check functions, classes, etc., in isolation.
      - name: Unit Tests
        run: echo "Simulating unit tests... Test execution completed successfully!"

      # Step 1.4: Log in to Docker Hub using GitHub secrets
      - name: Log in to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 1.5: Build the Docker image with a 'test' tag
      - name: Build Docker Image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
        run: |
          docker build -t $DOCKER_USERNAME/$DOCKER_IMAGE_NAME:test .

      # Step 1.6: Push the 'test' Docker image to the registry
      - name: Push Docker Image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
        run: |
          docker push $DOCKER_USERNAME/$DOCKER_IMAGE_NAME:test

  # Job 2: Test Job
  # Purpose: Run integration tests against the containerized application.
  # This validates that different parts of the application work together correctly.
  # Depends on: Build job must succeed first.
  Test:
    runs-on: ubuntu-latest
    needs: Build  # Ensures Test only runs if Build passes

    steps:
      # Step 2.1: Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2.2: Run integration tests (simulated here)
      # Integration tests validate interactions between application components.
      - name: Integration Tests
        run: echo "Simulating integration tests... Test execution completed successfully!"

  # Job 3: Release Job
  # Purpose: Promote the tested Docker image to the 'latest' tag and push to registry.
  # This makes the image available for deployment.
  # Depends on: Test job must succeed first.
  Release:
    runs-on: ubuntu-latest
    needs: Test  # Ensures Release only runs if Test passes

    steps:
      # Step 3.1: Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 3.2: Log in to Docker Hub using secrets
      - name: Log in to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3.3: Pull the 'test' image, tag it as 'latest', and push
      - name: Promote Docker Image to Latest
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
        run: |
          docker pull $DOCKER_USERNAME/$DOCKER_IMAGE_NAME:test
          docker tag $DOCKER_USERNAME/$DOCKER_IMAGE_NAME:test $DOCKER_USERNAME/$DOCKER_IMAGE_NAME:latest
          docker push $DOCKER_USERNAME/$DOCKER_IMAGE_NAME:latest